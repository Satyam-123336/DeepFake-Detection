services:
  - type: web
    name: deepfake-api
    env: python
    buildCommand: "apt-get update && apt-get install -y ffmpeg libgl1-mesa-glx libglib2.0-0 && pip install -r requirements.txt"
    startCommand: "uvicorn api_server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
