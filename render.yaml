services:
  # FastAPI Backend — Free Web Service (sleeps after 15min inactivity)
  - type: web
    name: deepfake-detection-api
    env: python
    region: oregon  # or frankfurt for EU
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LOG_LEVEL
        value: info
